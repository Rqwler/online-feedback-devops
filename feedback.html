<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Feedback Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; margin: 0; padding: 2rem; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 1.5rem 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    input, select, textarea { width: 100%; padding: .5rem; margin-top: .3rem; box-sizing: border-box; border: 1px solid #bbb; border-radius: 4px; font-size: 1rem; }
    .rating { display: flex; gap: 1rem; margin-top: .4rem; }
    .rating label { display: inline; font-weight: normal; margin: 0; }
    .rating input { width: auto; margin-right: .25rem; }
    button { margin-top: 1.5rem; padding: .6rem 1.4rem; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1558b0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Online Feedback Form</h1>
    <form action="/submit" method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="category">Feedback Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select --</option>
        <option>General</option>
        <option>Bug Report</option>
        <option>Feature Request</option>
        <option>Praise</option>
      </select>

      <label>Rating</label>
      <div class="rating">
        <span><input type="radio" id="r1" name="rating" value="1" required><label for="r1">1</label></span>
        <span><input type="radio" id="r2" name="rating" value="2"><label for="r2">2</label></span>
        <span><input type="radio" id="r3" name="rating" value="3"><label for="r3">3</label></span>
        <span><input type="radio" id="r4" name="rating" value="4"><label for="r4">4</label></span>
        <span><input type="radio" id="r5" name="rating" value="5"><label for="r5">5</label></span>
      </div>

      <label for="comments">Comments</label>
      <textarea id="comments" name="comments" rows="4"></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
